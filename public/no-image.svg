<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="No image available">
  <title>No Image</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Mask: cuts a clean gap in the icon along the slash -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="600">
      <rect width="800" height="600" fill="#fff"/>
      <line x1="262" y1="128" x2="538" y2="372" stroke="#000" stroke-width="34" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Photo icon: frame, sun, mountains -->
  <g mask="url(#cut)">
    <g fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(400 250)">
      <rect x="-130" y="-98" width="260" height="196" rx="22"/>
      <circle cx="-62" cy="-36" r="24"/>
      <path d="M-130 62 L-48 -8 L14 46 L56 12 L130 72"/>
    </g>
  </g>
  <!-- Slash: no image -->
  <line x1="262" y1="128" x2="538" y2="372" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <text x="400" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="6" fill="#94a3b8">NO IMAGE</text>
</svg>
